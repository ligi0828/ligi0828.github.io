    <div class="nav-inner">

      </nav>

          <option value="zh">中文</option>

  <main>
    <section class="page-head">
      <h1 class="page-title"><span class="grad-text" data-i18n="tools.title">网站工具</span></h1>
      <p class="page-sub" data-i18n="tools.sub">无需安装、无需注册，开箱即用的在线效率工具。</p>
    </section>

    <div class="grid tool-grid">

      <!-- ===== Base64 ===== -->
      <div class="card tool-card reveal">
        <div class="tool-head">
          <div class="tool-icon">⇄</div>
          <div>
            <h3 data-i18n="tools.b64.t">Base64 编解码</h3>
            <div class="tool-desc" data-i18n="tools.b64.d">将文本与 Base64 互相转换。</div>
          </div>
        </div>
        <div class="tool-body">
          <textarea class="ta" id="b64Input" data-i18n-ph="tools.b64.in" placeholder="输入文本..."></textarea>
          <div class="tool-row">
            <button class="btn btn-primary btn-sm" id="b64Encode" data-i18n="tools.b64.encode">编码</button>
            <button class="btn btn-ghost btn-sm" id="b64Decode" data-i18n="tools.b64.decode">解码</button>
            <button class="btn btn-ghost btn-sm" id="b64Copy" data-i18n="tools.copy">复制</button>
            <button class="btn btn-ghost btn-sm" id="b64Clear" data-i18n="tools.clear">清空</button>
          </div>
          <div class="tool-out" id="b64Out" data-i18n="tools.b64.out">结果将显示在这里...</div>
        </div>
      </div>

      <!-- ===== JSON ===== -->
      <div class="card tool-card reveal">
        <div class="tool-head">
          <div class="tool-icon">{ }</div>
          <div>
            <h3 data-i18n="tools.json.t">JSON 格式化</h3>
            <div class="tool-desc" data-i18n="tools.json.d">格式化、压缩并校验 JSON。</div>
          </div>
        </div>
        <div class="tool-body">
          <textarea class="ta" id="jsonInput" data-i18n-ph="tools.json.in" placeholder="粘贴 JSON..."></textarea>
          <div class="tool-row">
            <button class="btn btn-primary btn-sm" id="jsonFormat" data-i18n="tools.json.format">格式化</button>
            <button class="btn btn-ghost btn-sm" id="jsonMinify" data-i18n="tools.json.minify">压缩</button>
            <button class="btn btn-ghost btn-sm" id="jsonCopy" data-i18n="tools.copy">复制</button>
          </div>
          <div class="tool-out" id="jsonOut"></div>
        </div>
      </div>

      <!-- ===== SHA-256 ===== -->
      <div class="card tool-card reveal">
        <div class="tool-head">
          <div class="tool-icon">#</div>
          <div>
            <h3 data-i18n="tools.hash.t">SHA-256 哈希</h3>
            <div class="tool-desc" data-i18n="tools.hash.d">计算文本的 SHA-256 摘要。</div>
          </div>
        </div>
        <div class="tool-body">
          <textarea class="ta" id="hashInput" data-i18n-ph="tools.hash.in" placeholder="输入文本..."></textarea>
          <div class="tool-row">
            <button class="btn btn-primary btn-sm" id="hashRun" data-i18n="tools.hash.run">计算</button>
            <button class="btn btn-ghost btn-sm" id="hashCopy" data-i18n="tools.copy">复制</button>
          </div>
          <div class="tool-out" id="hashOut" style="min-height: 60px"></div>
        </div>
      </div>

      <!-- ===== Case ===== -->
      <div class="card tool-card reveal">
        <div class="tool-head">
          <div class="tool-icon">Aa</div>
          <div>
            <h3 data-i18n="tools.case.t">文本大小写</h3>
            <div class="tool-desc" data-i18n="tools.case.d">快速转换命名风格。</div>
          </div>
        </div>
        <div class="tool-body">
          <textarea class="ta" id="caseInput" data-i18n-ph="tools.case.in" placeholder="输入文本..."></textarea>
          <div class="tool-row">
            <button class="btn btn-primary btn-sm" data-case="lower" data-i18n="tools.case.lower">全小写</button>
            <button class="btn btn-ghost btn-sm" data-case="upper" data-i18n="tools.case.upper">全大写</button>
            <button class="btn btn-ghost btn-sm" data-case="camel" data-i18n="tools.case.camel">camelCase</button>
            <button class="btn btn-ghost btn-sm" data-case="kebab" data-i18n="tools.case.kebab">kebab-case</button>
            <button class="btn btn-ghost btn-sm" data-case="snake" data-i18n="tools.case.snake">snake_case</button>
          </div>
          <div class="tool-out" id="caseOut"></div>
        </div>
      </div>

      <!-- ===== Stats ===== -->
      <div class="card tool-card reveal">
        <div class="tool-head">
          <div class="tool-icon">Σ</div>
          <div>
            <h3 data-i18n="tools.stats.t">文本统计</h3>
            <div class="tool-desc" data-i18n="tools.stats.d">统计字符、单词与行数。</div>
          </div>
        </div>
        <div class="tool-body">
          <textarea class="ta" id="statsInput" data-i18n-ph="tools.stats.in" placeholder="输入文本..."></textarea>
          <div class="tool-row">
            <button class="btn btn-primary btn-sm" id="statsRun" data-i18n="tools.stats.t">文本统计</button>
            <button class="btn btn-ghost btn-sm" id="statsClear" data-i18n="tools.clear">清空</button>
          </div>
          <div class="tool-out" id="statsOut" data-i18n="tools.stats.out">字符：0 | 单词：0 | 行数：0</div>
        </div>
      </div>

    </div>
