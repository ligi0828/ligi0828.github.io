<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML游戏合集 - 可直接游玩</title>
    <style>
        :root {
            --primary: #6a11cb;
            --secondary: #2575fc;
            --dark: #2c3e50;
            --light: #f5f7fa;
            --gray: #7f8c8d;
            --success: #2ecc71;
            --danger: #e74c3c;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }
        
        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
        }
        
        .subtitle {
            font-size: 1.3rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.1);
            font-size: 1rem;
            outline: none;
        }
        
        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }
        
        .category-filter {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .category-btn {
            padding: 12px 22px;
            background: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .category-btn.active, .category-btn:hover {
            background: var(--primary);
            color: white;
        }
        
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .game-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .game-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .game-image {
            height: 200px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            position: relative;
            overflow: hidden;
        }
        
        .game-image::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.1);
        }
        
        .game-info {
            padding: 25px;
        }
        
        .game-title {
            font-size: 1.4rem;
            margin-bottom: 12px;
            color: var(--dark);
        }
        
        .game-description {
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 20px;
            min-height: 60px;
        }
        
        .game-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--gray);
            align-items: center;
        }
        
        .game-category {
            background: #eef2f7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .play-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(106, 17, 203, 0.3);
        }
        
        .play-btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(106, 17, 203, 0.4);
        }
        
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.6rem;
            color: var(--dark);
        }
        
        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--gray);
            transition: color 0.3s;
        }
        
        .close-modal:hover {
            color: var(--danger);
        }
        
        .modal-body {
            padding: 25px;
        }
        
        .game-container {
            margin-bottom: 25px;
        }
        
        .game-instructions {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .game-instructions h3 {
            margin-bottom: 10px;
            color: var(--dark);
        }
        
        .game-instructions ul {
            padding-left: 20px;
        }
        
        .game-instructions li {
            margin-bottom: 8px;
        }
        
        footer {
            text-align: center;
            margin-top: 60px;
            padding: 30px;
            color: var(--gray);
            font-size: 1rem;
            border-top: 1px solid #eee;
        }
        
        /* 游戏特定样式 */
        .game-canvas {
            display: block;
            margin: 0 auto;
            background: #f0f0f0;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 100%;
        }
        
        .game-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .game-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .game-btn:hover {
            background: var(--secondary);
        }
        
        .game-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            font-weight: 600;
            color: var(--dark);
            flex-wrap: wrap;
        }
        
        /* 移动设备控制 */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .mobile-btn {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        /* 触摸控制方向键 */
        .direction-pad {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            margin-top: 20px;
            max-width: 150px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .dir-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        
        .dir-btn.up {
            grid-column: 2;
            grid-row: 1;
        }
        
        .dir-btn.left {
            grid-column: 1;
            grid-row: 2;
        }
        
        .dir-btn.right {
            grid-column: 3;
            grid-row: 2;
        }
        
        .dir-btn.down {
            grid-column: 2;
            grid-row: 3;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
            }
            
            .search-box {
                min-width: 100%;
            }
            
            .games-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .game-canvas {
                width: 100%;
                height: auto;
            }
            
            .mobile-controls {
                display: flex;
            }
            
            .direction-pad {
                display: grid;
            }
            
            .modal-content {
                margin: 10px;
            }
        }
        
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            header {
                padding: 20px;
                margin-bottom: 20px;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .game-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .game-btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>HTML游戏合集</h1>
            <p class="subtitle">所有游戏均可直接在浏览器中游玩，无需安装任何插件或应用</p>
        </header>
        
        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索游戏...">
                <i>🔍</i>
            </div>
            
            <div class="category-filter">
                <button class="category-btn active" data-category="all">全部</button>
                <button class="category-btn" data-category="puzzle">解谜</button>
                <button class="category-btn" data-category="action">动作</button>
                <button class="category-btn" data-category="arcade">街机</button>
                <button class="category-btn" data-category="strategy">策略</button>
            </div>
        </div>
        
        <div class="games-grid" id="gamesGrid">
            <!-- 游戏卡片将通过JavaScript动态生成 -->
        </div>
        
        <footer>
            <p>© 2023 HTML游戏合集 | 所有游戏均使用纯HTML/CSS/JavaScript开发，可在现代浏览器中直接运行</p>
        </footer>
    </div>

    <!-- 游戏模态框 -->
    <div class="game-modal" id="gameModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalGameTitle">游戏名称</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalGameContent">
                <!-- 游戏内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        // 游戏数据
        const games = [
            {
                id: 1,
                title: "贪吃蛇",
                description: "经典贪吃蛇游戏，控制小蛇吃掉食物，避免撞到墙壁或自己的身体。",
                category: "arcade",
                icon: "🐍",
                playable: true
            },
            {
                id: 2,
                title: "记忆翻牌",
                description: "翻开卡片找到所有匹配的图案对，测试你的记忆力。",
                category: "puzzle",
                icon: "🎴",
                playable: true
            },
            {
                id: 3,
                title: "井字棋",
                description: "经典的两人对战游戏，在3x3网格中争取连成一条线。",
                category: "strategy",
                icon: "⭕",
                playable: true
            },
            {
                id: 4,
                title: "打砖块",
                description: "控制挡板反弹球击碎上方的砖块，不要错过球。",
                category: "action",
                icon: "🧱",
                playable: true
            },
            {
                id: 5,
                title: "数字华容道",
                description: "滑动数字方块，按顺序排列所有数字。",
                category: "puzzle",
                icon: "🔢",
                playable: true
            },
            {
                id: 6,
                title: "俄罗斯方块",
                description: "经典的方块消除游戏，排列完整的一行来得分。",
                category: "puzzle",
                icon: "🧩",
                playable: false
            },
            {
                id: 7,
                title: "太空侵略者",
                description: "射击从上方降落的敌人，保卫你的基地。",
                category: "action",
                icon: "👾",
                playable: false
            },
            {
                id: 8,
                title: "2048",
                description: "滑动数字方块，合并相同数字，目标是得到2048！",
                category: "puzzle",
                icon: "🔲",
                playable: false
            },
            {
                id: 9,
                title: "扫雷",
                description: "找出所有地雷而不触发任何一颗。",
                category: "puzzle",
                icon: "💣",
                playable: false
            },
            {
                id: 10,
                title: "接水果",
                description: "移动篮子接住下落的水果，避开炸弹。",
                category: "arcade",
                icon: "🍎",
                playable: false
            }
        ];

        // 生成游戏卡片
        function renderGames(gamesToRender) {
            const gamesGrid = document.getElementById('gamesGrid');
            gamesGrid.innerHTML = '';
            
            gamesToRender.forEach(game => {
                const gameCard = document.createElement('div');
                gameCard.className = 'game-card';
                gameCard.dataset.id = game.id;
                gameCard.dataset.category = game.category;
                
                gameCard.innerHTML = `
                    <div class="game-image">
                        ${game.icon}
                    </div>
                    <div class="game-info">
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-description">${game.description}</p>
                        <div class="game-meta">
                            <span class="game-category">${game.category}</span>
                            <button class="play-btn" data-id="${game.id}">
                                ${game.playable ? '立即游玩' : '即将推出'}
                            </button>
                        </div>
                    </div>
                `;
                
                gamesGrid.appendChild(gameCard);
            });

            // 添加游戏点击事件
            document.querySelectorAll('.play-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const gameId = parseInt(this.dataset.id);
                    const game = games.find(g => g.id === gameId);
                    
                    if (game.playable) {
                        openGameModal(game);
                    } else {
                        alert('此游戏即将推出，敬请期待！');
                    }
                });
            });
        }

        // 打开游戏模态框
        function openGameModal(game) {
            const modal = document.getElementById('gameModal');
            const modalTitle = document.getElementById('modalGameTitle');
            const modalContent = document.getElementById('modalGameContent');
            
            modalTitle.textContent = game.title;
            modalContent.innerHTML = getGameContent(game.id);
            
            modal.style.display = 'flex';
            
            // 防止背景滚动
            document.body.style.overflow = 'hidden';
            
            // 初始化游戏
            setTimeout(() => {
                initGame(game.id);
            }, 100);
        }

        // 关闭模态框
        document.getElementById('closeModal').addEventListener('click', function() {
            const modal = document.getElementById('gameModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
            
            // 停止所有游戏循环
            stopAllGames();
        });

        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('gameModal');
            if (event.target === modal) {
                modal.style.display = 'none';
                document.body.style.overflow = 'auto';
                
                // 停止所有游戏循环
                stopAllGames();
            }
        });

        // 停止所有游戏循环
        function stopAllGames() {
            if (window.snakeGameLoop) clearInterval(window.snakeGameLoop);
            if (window.breakoutGameLoop) clearInterval(window.breakoutGameLoop);
            if (window.puzzleTimer) clearInterval(window.puzzleTimer);
        }

        // 获取游戏内容
        function getGameContent(gameId) {
            switch(gameId) {
                case 1: // 贪吃蛇
                    return `
                        <div class="game-container">
                            <div class="game-stats">
                                <div>得分: <span id="snakeScore">0</span></div>
                                <div>最高分: <span id="snakeHighScore">0</span></div>
                            </div>
                            <canvas id="snakeGame" width="400" height="400" class="game-canvas"></canvas>
                            <div class="game-controls">
                                <button class="game-btn" id="snakeStart">开始游戏</button>
                                <button class="game-btn" id="snakePause">暂停</button>
                                <button class="game-btn" id="snakeReset">重新开始</button>
                            </div>
                            <div class="direction-pad">
                                <button class="dir-btn up">↑</button>
                                <button class="dir-btn left">←</button>
                                <button class="dir-btn right">→</button>
                                <button class="dir-btn down">↓</button>
                            </div>
                        </div>
                        <div class="game-instructions">
                            <h3>游戏说明</h3>
                            <ul>
                                <li>使用键盘方向键或屏幕上的方向按钮控制蛇的移动方向</li>
                                <li>吃到食物可以增加长度和得分</li>
                                <li>撞到墙壁或自己的身体游戏结束</li>
                                <li>尽可能获得高分！</li>
                            </ul>
                        </div>
                    `;
                case 2: // 记忆翻牌
                    return `
                        <div class="game-container">
                            <div class="game-stats">
                                <div>翻牌次数: <span id="memoryMoves">0</span></div>
                                <div>匹配对数: <span id="memoryMatches">0</span>/8</div>
                            </div>
                            <div id="memoryGame" class="memory-game"></div>
                            <div class="game-controls">
                                <button class="game-btn" id="memoryStart">开始游戏</button>
                                <button class="game-btn" id="memoryReset">重新开始</button>
                            </div>
                        </div>
                        <div class="game-instructions">
                            <h3>游戏说明</h3>
                            <ul>
                                <li>点击卡片翻开它们</li>
                                <li>找到所有匹配的卡片对</li>
                                <li>用最少的翻牌次数完成游戏</li>
                                <li>测试你的记忆力！</li>
                            </ul>
                        </div>
                    `;
                case 3: // 井字棋
                    return `
                        <div class="game-container">
                            <div class="game-stats">
                                <div>当前玩家: <span id="currentPlayer">X</span></div>
                                <div>游戏状态: <span id="gameStatus">进行中</span></div>
                            </div>
                            <div id="ticTacToeGame" class="tic-tac-toe"></div>
                            <div class="game-controls">
                                <button class="game-btn" id="ticTacToeReset">重新开始</button>
                            </div>
                        </div>
                        <div class="game-instructions">
                            <h3>游戏说明</h3>
                            <ul>
                                <li>两名玩家轮流在3x3网格中放置X和O</li>
                                <li>先在任意方向连成一条线的玩家获胜</li>
                                <li>如果网格填满但没有玩家获胜，则为平局</li>
                            </ul>
                        </div>
                    `;
                case 4: // 打砖块
                    return `
                        <div class="game-container">
                            <div class="game-stats">
                                <div>得分: <span id="breakoutScore">0</span></div>
                                <div>生命: <span id="breakoutLives">3</span></div>
                            </div>
                            <canvas id="breakoutGame" width="400" height="500" class="game-canvas"></canvas>
                            <div class="game-controls">
                                <button class="game-btn" id="breakoutStart">开始游戏</button>
                                <button class="game-btn" id="breakoutPause">暂停</button>
                                <button class="game-btn" id="breakoutReset">重新开始</button>
                            </div>
                            <div class="mobile-controls">
                                <button class="mobile-btn" id="breakoutLeft">←</button>
                                <button class="mobile-btn" id="breakoutRight">→</button>
                            </div>
                        </div>
                        <div class="game-instructions">
                            <h3>游戏说明</h3>
                            <ul>
                                <li>使用鼠标、键盘左右键或屏幕上的按钮移动挡板</li>
                                <li>反弹球击碎上方的砖块</li>
                                <li>不要错过球，否则会失去一条生命</li>
                                <li>击碎所有砖块获胜</li>
                            </ul>
                        </div>
                    `;
                case 5: // 数字华容道
                    return `
                        <div class="game-container">
                            <div class="game-stats">
                                <div>移动步数: <span id="puzzleMoves">0</span></div>
                                <div>用时: <span id="puzzleTime">0</span>秒</div>
                            </div>
                            <div id="puzzleGame" class="puzzle-game"></div>
                            <div class="game-controls">
                                <button class="game-btn" id="puzzleStart">开始游戏</button>
                                <button class="game-btn" id="puzzleReset">重新开始</button>
                            </div>
                        </div>
                        <div class="game-instructions">
                            <h3>游戏说明</h3>
                            <ul>
                                <li>点击与空位相邻的数字方块进行移动</li>
                                <li>目标是将数字按顺序排列</li>
                                <li>用最少的步数和时间完成拼图</li>
                            </ul>
                        </div>
                    `;
                default:
                    return `<p>此游戏即将推出，敬请期待！</p>`;
            }
        }

        function initGame(gameId) {
            switch(gameId) {
                case 1:
                    initSnakeGame();
                    break;
                case 2:
                    initMemoryGame();
                    break;
                case 3:
                    initTicTacToe();
                    break;
                case 4:
                    initBreakout();
                    break;
                case 5:
                    initPuzzle();
                    break;
            }
        }

        // 贪吃蛇游戏实现 - 修复版
        function initSnakeGame() {
            const canvas = document.getElementById('snakeGame');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('snakeScore');
            const highScoreElement = document.getElementById('snakeHighScore');
            const startBtn = document.getElementById('snakeStart');
            const pauseBtn = document.getElementById('snakePause');
            const resetBtn = document.getElementById('snakeReset');
            
            // 调整画布大小以适应移动设备
            if (window.innerWidth < 768) {
                canvas.width = Math.min(400, window.innerWidth - 40);
                canvas.height = canvas.width;
            }
            
            const gridSize = 20;
            const tileCount = canvas.width / gridSize;
            
            let snake = [];
            let food = {};
            let dx = 0;
            let dy = 0;
            let score = 0;
            let highScore = localStorage.getItem('snakeHighScore') || 0;
            let gameRunning = false;
            let gameLoop;
            
            highScoreElement.textContent = highScore;
            
            function init() {
                // 蛇的初始位置在画布中央
                snake = [
                    {x: Math.floor(tileCount/2), y: Math.floor(tileCount/2)},
                    {x: Math.floor(tileCount/2)-1, y: Math.floor(tileCount/2)},
                    {x: Math.floor(tileCount/2)-2, y: Math.floor(tileCount/2)}
                ];
                
                // 生成食物位置
                generateFood();
                
                dx = 1; // 初始向右移动
                dy = 0;
                score = 0;
                scoreElement.textContent = score;
            }
            
            function generateFood() {
                // 生成不在蛇身上的食物位置
                do {
                    food = {
                        x: Math.floor(Math.random() * tileCount),
                        y: Math.floor(Math.random() * tileCount)
                    };
                } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
            }
            
            function drawGame() {
                // 清空画布
                ctx.fillStyle = '#f0f0f0';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制蛇
                snake.forEach((segment, index) => {
                    // 蛇头用不同颜色
                    if (index === 0) {
                        ctx.fillStyle = '#2ecc71'; // 蛇头颜色
                    } else {
                        ctx.fillStyle = '#27ae60'; // 蛇身颜色
                    }
                    ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
                    
                    // 绘制蛇身边框
                    ctx.strokeStyle = '#1e8449';
                    ctx.strokeRect(segment.x * gridSize, segment.y * gridSize, gridSize - 1, gridSize - 1);
                });
                
                // 绘制食物
                ctx.fillStyle = '#e74c3c';
                ctx.beginPath();
                ctx.arc(
                    food.x * gridSize + gridSize/2, 
                    food.y * gridSize + gridSize/2, 
                    gridSize/2 - 2, 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
                
                // 绘制网格
                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 0.5;
                for (let i = 0; i < tileCount; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * gridSize, 0);
                    ctx.lineTo(i * gridSize, canvas.height);
                    ctx.stroke();
                    
                    ctx.beginPath();
                    ctx.moveTo(0, i * gridSize);
                    ctx.lineTo(canvas.width, i * gridSize);
                    ctx.stroke();
                }
            }
            
            function update() {
                if (!gameRunning) return;
                
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                
                // 检查游戏结束条件
                if (
                    head.x < 0 || head.x >= tileCount || 
                    head.y < 0 || head.y >= tileCount ||
                    snake.some(segment => segment.x === head.x && segment.y === head.y)
                ) {
                    gameOver();
                    return;
                }
                
                snake.unshift(head);
                
                // 检查是否吃到食物
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreElement.textContent = score;
                    
                    // 生成新食物
                    generateFood();
                } else {
                    snake.pop();
                }
            }
            
            function gameOver() {
                gameRunning = false;
                clearInterval(gameLoop);
                alert(`游戏结束！你的得分: ${score}`);
                
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
            }
            
            function gameStep() {
                update();
                drawGame();
            }
            
            function startGame() {
                if (gameRunning) return;
                gameRunning = true;
                gameLoop = setInterval(gameStep, 150);
                window.snakeGameLoop = gameLoop;
            }
            
            function pauseGame() {
                gameRunning = !gameRunning;
                pauseBtn.textContent = gameRunning ? '暂停' : '继续';
            }
            
            function resetGame() {
                gameRunning = false;
                clearInterval(gameLoop);
                init();
                drawGame();
                pauseBtn.textContent = '暂停';
            }
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (!gameRunning) return;
                
                switch(e.key) {
                    case 'ArrowUp':
                        if (dy !== 1) {
                            dx = 0;
                            dy = -1;
                        }
                        break;
                    case 'ArrowDown':
                        if (dy !== -1) {
                            dx = 0;
                            dy = 1;
                        }
                        break;
                    case 'ArrowLeft':
                        if (dx !== 1) {
                            dx = -1;
                            dy = 0;
                        }
                        break;
                    case 'ArrowRight':
                        if (dx !== -1) {
                            dx = 1;
                            dy = 0;
                        }
                        break;
                }
            });
            
            // 触摸控制
            document.querySelector('.dir-btn.up').addEventListener('click', () => {
                if (gameRunning && dy !== 1) {
                    dx = 0;
                    dy = -1;
                }
            });
            
            document.querySelector('.dir-btn.down').addEventListener('click', () => {
                if (gameRunning && dy !== -1) {
                    dx = 0;
                    dy = 1;
                }
            });
            
            document.querySelector('.dir-btn.left').addEventListener('click', () => {
                if (gameRunning && dx !== 1) {
                    dx = -1;
                    dy = 0;
                }
            });
            
            document.querySelector('.dir-btn.right').addEventListener('click', () => {
                if (gameRunning && dx !== -1) {
                    dx = 1;
                    dy = 0;
                }
            });
            
            // 按钮事件
            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', pauseGame);
            resetBtn.addEventListener('click', resetGame);
            
            // 初始绘制
            init();
            drawGame();
        }

        // 记忆翻牌游戏实现
        function initMemoryGame() {
            const memoryGame = document.getElementById('memoryGame');
            const movesElement = document.getElementById('memoryMoves');
            const matchesElement = document.getElementById('memoryMatches');
            const startBtn = document.getElementById('memoryStart');
            const resetBtn = document.getElementById('memoryReset');
            
            const cardValues = ['🍎', '🍌', '🍒', '🍇', '🍊', '🍓', '🥝', '🍑'];
            let cards = [];
            let flippedCards = [];
            let matchedPairs = 0;
            let moves = 0;
            let gameStarted = false;
            
            function init() {
                memoryGame.innerHTML = '';
                cards = [...cardValues, ...cardValues]
                    .sort(() => Math.random() - 0.5)
                    .map((value, index) => ({ id: index, value, flipped: false, matched: false }));
                
                cards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.className = 'memory-card';
                    cardElement.dataset.id = card.id;
                    cardElement.innerHTML = `
                        <div class="card-front">?</div>
                        <div class="card-back">${card.value}</div>
                    `;
                    
                    cardElement.addEventListener('click', () => flipCard(card.id));
                    memoryGame.appendChild(cardElement);
                });
                
                flippedCards = [];
                matchedPairs = 0;
                moves = 0;
                movesElement.textContent = moves;
                matchesElement.textContent = `${matchedPairs}/8`;
                gameStarted = true;
                
                // 添加CSS样式
                const style = document.createElement('style');
                style.textContent = `
                    .memory-game {
                        display: grid;
                        grid-template-columns: repeat(4, 1fr);
                        gap: 10px;
                        max-width: 400px;
                        margin: 0 auto;
                    }
                    .memory-card {
                        width: 80px;
                        height: 80px;
                        perspective: 1000px;
                        cursor: pointer;
                    }
                    .memory-card > div {
                        width: 100%;
                        height: 100%;
                        position: absolute;
                        backface-visibility: hidden;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 2rem;
                        border-radius: 8px;
                        transition: transform 0.6s;
                    }
                    .card-front {
                        background: linear-gradient(135deg, #6a11cb, #2575fc);
                        color: white;
                    }
                    .card-back {
                        background: white;
                        transform: rotateY(180deg);
                        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                    }
                    .memory-card.flipped .card-front {
                        transform: rotateY(180deg);
                    }
                    .memory-card.flipped .card-back {
                        transform: rotateY(0);
                    }
                    .memory-card.matched .card-back {
                        background: #2ecc71;
                    }
                    
                    @media (max-width: 480px) {
                        .memory-game {
                            grid-template-columns: repeat(4, 1fr);
                            gap: 5px;
                        }
                        .memory-card {
                            width: 70px;
                            height: 70px;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            function flipCard(cardId) {
                if (!gameStarted) return;
                
                const card = cards.find(c => c.id === cardId);
                const cardElement = document.querySelector(`.memory-card[data-id="${cardId}"]`);
                
                if (card.flipped || card.matched || flippedCards.length >= 2) return;
                
                card.flipped = true;
                cardElement.classList.add('flipped');
                flippedCards.push(card);
                
                if (flippedCards.length === 2) {
                    moves++;
                    movesElement.textContent = moves;
                    
                    const [card1, card2] = flippedCards;
                    
                    if (card1.value === card2.value) {
                        // 匹配成功
                        card1.matched = true;
                        card2.matched = true;
                        matchedPairs++;
                        matchesElement.textContent = `${matchedPairs}/8`;
                        
                        flippedCards = [];
                        
                        if (matchedPairs === 8) {
                            setTimeout(() => {
                                alert(`恭喜！你用了 ${moves} 步完成了游戏！`);
                            }, 500);
                        }
                    } else {
                        // 不匹配，翻回去
                        setTimeout(() => {
                            card1.flipped = false;
                            card2.flipped = false;
                            
                            document.querySelector(`.memory-card[data-id="${card1.id}"]`).classList.remove('flipped');
                            document.querySelector(`.memory-card[data-id="${card2.id}"]`).classList.remove('flipped');
                            
                            flippedCards = [];
                        }, 1000);
                    }
                }
            }
            
            startBtn.addEventListener('click', init);
            resetBtn.addEventListener('click', init);
            
            // 初始游戏
            init();
        }

        // 井字棋游戏实现
        function initTicTacToe() {
            const ticTacToeGame = document.getElementById('ticTacToeGame');
            const currentPlayerElement = document.getElementById('currentPlayer');
            const gameStatusElement = document.getElementById('gameStatus');
            const resetBtn = document.getElementById('ticTacToeReset');
            
            let board = Array(9).fill('');
            let currentPlayer = 'X';
            let gameActive = true;
            
            function init() {
                ticTacToeGame.innerHTML = '';
                board = Array(9).fill('');
                currentPlayer = 'X';
                gameActive = true;
                
                currentPlayerElement.textContent = currentPlayer;
                gameStatusElement.textContent = '进行中';
                
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'tic-tac-toe-cell';
                    cell.dataset.index = i;
                    cell.addEventListener('click', () => handleCellClick(i));
                    ticTacToeGame.appendChild(cell);
                }
                
                // 添加CSS样式
                const style = document.createElement('style');
                style.textContent = `
                    .tic-tac-toe {
                        display: grid;
                        grid-template-columns: repeat(3, 1fr);
                        gap: 5px;
                        max-width: 300px;
                        margin: 0 auto;
                    }
                    .tic-tac-toe-cell {
                        width: 100px;
                        height: 100px;
                        background: white;
                        border: 2px solid #6a11cb;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 2.5rem;
                        font-weight: bold;
                        cursor: pointer;
                        border-radius: 5px;
                    }
                    .tic-tac-toe-cell:hover {
                        background: #f0f0f0;
                    }
                    .tic-tac-toe-cell.x {
                        color: #e74c3c;
                    }
                    .tic-tac-toe-cell.o {
                        color: #3498db;
                    }
                    
                    @media (max-width: 480px) {
                        .tic-tac-toe {
                            max-width: 250px;
                        }
                        .tic-tac-toe-cell {
                            width: 80px;
                            height: 80px;
                            font-size: 2rem;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            function handleCellClick(index) {
                if (!gameActive || board[index] !== '') return;
                
                board[index] = currentPlayer;
                const cell = document.querySelector(`.tic-tac-toe-cell[data-index="${index}"]`);
                cell.textContent = currentPlayer;
                cell.classList.add(currentPlayer.toLowerCase());
                
                if (checkWinner()) {
                    gameStatusElement.textContent = `玩家 ${currentPlayer} 获胜！`;
                    gameActive = false;
                } else if (board.every(cell => cell !== '')) {
                    gameStatusElement.textContent = '平局！';
                    gameActive = false;
                } else {
                    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                    currentPlayerElement.textContent = currentPlayer;
                }
            }
            
            function checkWinner() {
                const winPatterns = [
                    [0, 1, 2], [3, 4, 5], [6, 7, 8], // 行
                    [0, 3, 6], [1, 4, 7], [2, 5, 8], // 列
                    [0, 4, 8], [2, 4, 6] // 对角线
                ];
                
                return winPatterns.some(pattern => {
                    const [a, b, c] = pattern;
                    return board[a] !== '' && board[a] === board[b] && board[a] === board[c];
                });
            }
            
            resetBtn.addEventListener('click', init);
            
            // 初始游戏
            init();
        }

        // 打砖块游戏实现
        function initBreakout() {
            const canvas = document.getElementById('breakoutGame');
            const ctx = canvas.getContext('2d');
            const scoreElement = document.getElementById('breakoutScore');
            const livesElement = document.getElementById('breakoutLives');
            const startBtn = document.getElementById('breakoutStart');
            const pauseBtn = document.getElementById('breakoutPause');
            const resetBtn = document.getElementById('breakoutReset');
            const leftBtn = document.getElementById('breakoutLeft');
            const rightBtn = document.getElementById('breakoutRight');
            
            // 调整画布大小以适应移动设备
            if (window.innerWidth < 768) {
                canvas.width = Math.min(400, window.innerWidth - 40);
                canvas.height = canvas.width * 1.25; // 保持宽高比
            }
            
            const paddleHeight = 10;
            const paddleWidth = 75;
            const ballRadius = 10;
            const brickRowCount = 5;
            const brickColumnCount = 8;
            const brickWidth = 50;
            const brickHeight = 20;
            const brickPadding = 10;
            const brickOffsetTop = 30;
            const brickOffsetLeft = 20;
            
            let paddleX = (canvas.width - paddleWidth) / 2;
            let ballX = canvas.width / 2;
            let ballY = canvas.height - 30;
            let ballDX = 4;
            let ballDY = -4;
            let score = 0;
            let lives = 3;
            let rightPressed = false;
            let leftPressed = false;
            let gameRunning = false;
            let gameLoop;
            
            const bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
            
            function init() {
                paddleX = (canvas.width - paddleWidth) / 2;
                ballX = canvas.width / 2;
                ballY = canvas.height - 30;
                ballDX = 4;
                ballDY = -4;
                score = 0;
                lives = 3;
                
                scoreElement.textContent = score;
                livesElement.textContent = lives;
                
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        bricks[c][r].status = 1;
                    }
                }
            }
            
            function drawBall() {
                ctx.beginPath();
                ctx.arc(ballX, ballY, ballRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
                ctx.closePath();
            }
            
            function drawPaddle() {
                ctx.beginPath();
                ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
                ctx.fillStyle = '#6a11cb';
                ctx.fill();
                ctx.closePath();
            }
            
            function drawBricks() {
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        if (bricks[c][r].status === 1) {
                            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                            bricks[c][r].x = brickX;
                            bricks[c][r].y = brickY;
                            
                            ctx.beginPath();
                            ctx.rect(brickX, brickY, brickWidth, brickHeight);
                            ctx.fillStyle = '#3498db';
                            ctx.fill();
                            ctx.closePath();
                        }
                    }
                }
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawBricks();
                drawBall();
                drawPaddle();
                collisionDetection();
                
                if (ballX + ballDX > canvas.width - ballRadius || ballX + ballDX < ballRadius) {
                    ballDX = -ballDX;
                }
                
                if (ballY + ballDY < ballRadius) {
                    ballDY = -ballDY;
                } else if (ballY + ballDY > canvas.height - ballRadius) {
                    if (ballX > paddleX && ballX < paddleX + paddleWidth) {
                        ballDY = -ballDY;
                    } else {
                        lives--;
                        livesElement.textContent = lives;
                        
                        if (lives === 0) {
                            gameOver();
                        } else {
                            ballX = canvas.width / 2;
                            ballY = canvas.height - 30;
                            ballDX = 4;
                            ballDY = -4;
                            paddleX = (canvas.width - paddleWidth) / 2;
                        }
                    }
                }
                
                ballX += ballDX;
                ballY += ballDY;
                
                if (rightPressed && paddleX < canvas.width - paddleWidth) {
                    paddleX += 7;
                } else if (leftPressed && paddleX > 0) {
                    paddleX -= 7;
                }
            }
            
            function collisionDetection() {
                for (let c = 0; c < brickColumnCount; c++) {
                    for (let r = 0; r < brickRowCount; r++) {
                        const brick = bricks[c][r];
                        if (brick.status === 1) {
                            if (
                                ballX > brick.x && 
                                ballX < brick.x + brickWidth && 
                                ballY > brick.y && 
                                ballY < brick.y + brickHeight
                            ) {
                                ballDY = -ballDY;
                                brick.status = 0;
                                score += 10;
                                scoreElement.textContent = score;
                                
                                if (score === brickRowCount * brickColumnCount * 10) {
                                    alert('恭喜！你赢了！');
                                    gameRunning = false;
                                    clearInterval(gameLoop);
                                }
                            }
                        }
                    }
                }
            }
            
            function gameOver() {
                gameRunning = false;
                clearInterval(gameLoop);
                alert('游戏结束！');
            }
            
            function startGame() {
                if (gameRunning) return;
                gameRunning = true;
                gameLoop = setInterval(draw, 10);
                window.breakoutGameLoop = gameLoop;
            }
            
            function pauseGame() {
                gameRunning = !gameRunning;
                if (gameRunning) {
                    gameLoop = setInterval(draw, 10);
                    pauseBtn.textContent = '暂停';
                } else {
                    clearInterval(gameLoop);
                    pauseBtn.textContent = '继续';
                }
            }
            
            function resetGame() {
                gameRunning = false;
                clearInterval(gameLoop);
                init();
                draw();
                pauseBtn.textContent = '暂停';
            }
            
            // 键盘控制
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Right' || e.key === 'ArrowRight') {
                    rightPressed = true;
                } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                    leftPressed = true;
                }
            });
            
            document.addEventListener('keyup', (e) => {
                if (e.key === 'Right' || e.key === 'ArrowRight') {
                    rightPressed = false;
                } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
                    leftPressed = false;
                }
            });
            
            // 鼠标控制
            canvas.addEventListener('mousemove', (e) => {
                const relativeX = e.clientX - canvas.getBoundingClientRect().left;
                if (relativeX > 0 && relativeX < canvas.width) {
                    paddleX = relativeX - paddleWidth / 2;
                }
            });
            
            // 触摸控制
            leftBtn.addEventListener('mousedown', () => leftPressed = true);
            leftBtn.addEventListener('mouseup', () => leftPressed = false);
            leftBtn.addEventListener('touchstart', () => leftPressed = true);
            leftBtn.addEventListener('touchend', () => leftPressed = false);
            
            rightBtn.addEventListener('mousedown', () => rightPressed = true);
            rightBtn.addEventListener('mouseup', () => rightPressed = false);
            rightBtn.addEventListener('touchstart', () => rightPressed = true);
            rightBtn.addEventListener('touchend', () => rightPressed = false);
            
            // 按钮事件
            startBtn.addEventListener('click', startGame);
            pauseBtn.addEventListener('click', pauseGame);
            resetBtn.addEventListener('click', resetGame);
            
            // 初始绘制
            init();
            draw();
        }

        // 数字华容道游戏实现
        function initPuzzle() {
            const puzzleGame = document.getElementById('puzzleGame');
            const movesElement = document.getElementById('puzzleMoves');
            const timeElement = document.getElementById('puzzleTime');
            const startBtn = document.getElementById('puzzleStart');
            const resetBtn = document.getElementById('puzzleReset');
            
            let puzzle = [];
            let emptyIndex = 8;
            let moves = 0;
            let time = 0;
            let timer;
            let gameStarted = false;
            
            function init() {
                puzzleGame.innerHTML = '';
                
                // 创建初始拼图（已解决状态）
                puzzle = [1, 2, 3, 4, 5, 6, 7, 8, 0];
                emptyIndex = 8;
                
                // 随机打乱拼图
                for (let i = 0; i < 1000; i++) {
                    const possibleMoves = getPossibleMoves();
                    const randomMove = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                    moveTile(randomMove);
                }
                
                // 渲染拼图
                puzzle.forEach((value, index) => {
                    const tile = document.createElement('div');
                    tile.className = `puzzle-tile ${value === 0 ? 'empty' : ''}`;
                    tile.textContent = value === 0 ? '' : value;
                    tile.dataset.index = index;
                    
                    if (value !== 0) {
                        tile.addEventListener('click', () => handleTileClick(index));
                    }
                    
                    puzzleGame.appendChild(tile);
                });
                
                moves = 0;
                time = 0;
                movesElement.textContent = moves;
                timeElement.textContent = time;
                
                // 添加CSS样式
                const style = document.createElement('style');
                style.textContent = `
                    .puzzle-game {
                        display: grid;
                        grid-template-columns: repeat(3, 1fr);
                        gap: 5px;
                        max-width: 300px;
                        margin: 0 auto;
                    }
                    .puzzle-tile {
                        width: 95px;
                        height: 95px;
                        background: linear-gradient(135deg, #6a11cb, #2575fc);
                        color: white;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 2rem;
                        font-weight: bold;
                        border-radius: 5px;
                        cursor: pointer;
                        transition: transform 0.2s;
                    }
                    .puzzle-tile:hover:not(.empty) {
                        transform: scale(1.05);
                    }
                    .puzzle-tile.empty {
                        background: #f0f0f0;
                        cursor: default;
                    }
                    
                    @media (max-width: 480px) {
                        .puzzle-game {
                            max-width: 250px;
                        }
                        .puzzle-tile {
                            width: 80px;
                            height: 80px;
                            font-size: 1.5rem;
                        }
                    }
                `;
                document.head.appendChild(style);
            }
            
            function getPossibleMoves() {
                const moves = [];
                const row = Math.floor(emptyIndex / 3);
                const col = emptyIndex % 3;
                
                if (row > 0) moves.push(emptyIndex - 3); // 上
                if (row < 2) moves.push(emptyIndex + 3); // 下
                if (col > 0) moves.push(emptyIndex - 1); // 左
                if (col < 2) moves.push(emptyIndex + 1); // 右
                
                return moves;
            }
            
            function moveTile(index) {
                if (!getPossibleMoves().includes(index)) return false;
                
                // 交换位置
                [puzzle[emptyIndex], puzzle[index]] = [puzzle[index], puzzle[emptyIndex]];
                emptyIndex = index;
                
                return true;
            }
            
            function handleTileClick(index) {
                if (!gameStarted) {
                    gameStarted = true;
                    startTimer();
                }
                
                if (moveTile(index)) {
                    moves++;
                    movesElement.textContent = moves;
                    updatePuzzleDisplay();
                    
                    if (checkWin()) {
                        clearInterval(timer);
                        setTimeout(() => {
                            alert(`恭喜！你在 ${time} 秒内用 ${moves} 步完成了拼图！`);
                        }, 500);
                    }
                }
            }
            
            function updatePuzzleDisplay() {
                const tiles = document.querySelectorAll('.puzzle-tile');
                tiles.forEach((tile, index) => {
                    tile.textContent = puzzle[index] === 0 ? '' : puzzle[index];
                    tile.className = `puzzle-tile ${puzzle[index] === 0 ? 'empty' : ''}`;
                    
                    if (puzzle[index] !== 0) {
                        tile.addEventListener('click', () => handleTileClick(index));
                    } else {
                        tile.removeEventListener('click', () => handleTileClick(index));
                    }
                });
            }
            
            function checkWin() {
                for (let i = 0; i < 8; i++) {
                    if (puzzle[i] !== i + 1) return false;
                }
                return puzzle[8] === 0;
            }
            
            function startTimer() {
                clearInterval(timer);
                timer = setInterval(() => {
                    time++;
                    timeElement.textContent = time;
                }, 1000);
                window.puzzleTimer = timer;
            }
            
            startBtn.addEventListener('click', () => {
                if (!gameStarted) {
                    gameStarted = true;
                    startTimer();
                }
            });
            
            resetBtn.addEventListener('click', () => {
                gameStarted = false;
                clearInterval(timer);
                init();
            });
            
            // 初始游戏
            init();
        }

        // 初始渲染
        renderGames(games);

        // 搜索功能
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredGames = games.filter(game => 
                game.title.toLowerCase().includes(searchTerm) || 
                game.description.toLowerCase().includes(searchTerm) ||
                game.category.toLowerCase().includes(searchTerm)
            );
            renderGames(filteredGames);
        });

        // 分类筛选
        document.querySelectorAll('.category-btn').forEach(button => {
            button.addEventListener('click', function() {
                // 更新活动按钮
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                this.classList.add('active');
                
                const category = this.getAttribute('data-category');
                let filteredGames;
                
                if (category === 'all') {
                    filteredGames = games;
                } else {
                    filteredGames = games.filter(game => game.category === category);
                }
                
                renderGames(filteredGames);
            });
        });
    </script>
</body>
</html>
